# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
name=antigravity
template=template.md
cli=agy
spawnable=yes
# antigravity invokes a skill with "$", not Claude Code's "/" (see spawn.sh, #283).
cmd_prefix=$
model_arg=--model
prompt_arg=--prompt-interactive
detect=explicit
hooks_file=.agent/rules/agmsg.md
readiness_sentinel=no
delivery_modes=monitor turn off
# Input box recognition (measured on agy 1.4.9, Windows/herdr, 2026-10-29): the
# box is the pair of 20+ rule lines carrying a ">" line; the live widget is
# followed by one footer line ("? for shortcuts" or "esc to cancel").
input_prompt_marker=>
input_prompt_boxed=yes
# Confirmation screens (permission, trust) have no input box and are drawn
# BELOW the last rule line. Never type while one is showing (poke exit 16).
# "|"-separated literal line prefixes, matched after left-trim.
input_refuse_screen=Requesting permission for:|Run this command?|Do you trust the contents
# More non-blank lines than this below the last rule = not a live box (exit 15).
input_max_trailing_lines=3
